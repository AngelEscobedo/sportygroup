<ul class="grid grid-cols-1 items-start gap-4 sm:grid-cols-2 lg:grid-cols-3" role="list">
  @for (league of leagues(); track league.idLeague) {
    <li>
      <app-league-card
        [league]="league"
        [expanded]="league.idLeague === expandedLeagueId()"
        [featured]="league.idLeague === featuredLeagueId()"
        (toggle)="toggle.emit(league.idLeague)"
      />
    </li>
  }
</ul>
